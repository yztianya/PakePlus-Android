<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>证件照工具 - 尺寸修改 / 换底色 / 相纸排版</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: #F2F4F7; color: #333; min-height: 100vh; }
  header { padding: 16px 28px; display: flex; align-items: center; gap: 12px; }
  .logo { width: 40px; height: 40px; border-radius: 12px; background: #FE6603; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #fff; box-shadow: 0 4px 12px rgba(254,102,3,.25); flex-shrink: 0; }
  header h1 { font-size: 20px; color: #333333; }
  header p { font-size: 12px; color: #7C8794; margin-top: 2px; }
  .container { display: flex; gap: 18px; padding: 0 24px 24px; max-width: 1440px; margin: 0 auto; }
  .panel { background: #fff; border-radius: 16px; box-shadow: 0 2px 16px rgba(90,80,160,.08); padding: 18px; }
  .controls { width: 370px; flex-shrink: 0; max-height: calc(100vh - 110px); overflow-y: auto; }
  .controls::-webkit-scrollbar { width: 6px; }
  .controls::-webkit-scrollbar-thumb { background: #d8d4ee; border-radius: 3px; }
  .preview { flex: 1; display: flex; flex-direction: column; }
  .step { border: 1px solid #F2F2F2; border-radius: 12px; padding: 14px; margin-bottom: 14px; background: #F8FAFA; }
  .step-title { font-size: 14px; font-weight: bold; color: #244B55; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .step-title .num { background: #FE6603; color: #fff; width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0; }
  /* 上传拖拽区 */
  .dropzone { border: 2px dashed #9ED9DA; border-radius: 12px; padding: 26px 12px; text-align: center; cursor: pointer; background: #F5FBFB; transition: all .2s; }
  .dropzone:hover, .dropzone.dragover { border-color: #FE6603; background: #FFF1E8; }
  .dropzone .dz-icon { font-size: 28px; margin-bottom: 6px; }
  .dropzone .dz-main { font-size: 14px; color: #244B55; font-weight: bold; }
  .dropzone .dz-sub { font-size: 11px; color: #7C8794; margin-top: 5px; }
  /* 规格卡片 */
  .spec-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; max-height: 300px; overflow-y: auto; padding: 2px; }
  .spec-grid::-webkit-scrollbar { width: 5px; }
  .spec-grid::-webkit-scrollbar-thumb { background: #d8d4ee; border-radius: 3px; }
  .spec-card { border: 1.5px solid #E5E5E5; border-radius: 10px; padding: 8px 10px; cursor: pointer; background: #fff; transition: all .15s; }
  .spec-card:hover { border-color: #FDBA8A; }
  .spec-card.active { border-color: #FE6603; background: #FFF1E8; box-shadow: 0 0 0 2px rgba(254,102,3,.15); }
  .spec-card .spec-name { font-size: 13px; font-weight: bold; color: #123B43; display: flex; align-items: center; gap: 5px; }
  .spec-card .spec-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; border: 1px solid rgba(0,0,0,.1); }
  .spec-card .spec-size { font-size: 10px; color: #7C8794; margin-top: 3px; }
  .spec-card .spec-desc { font-size: 10px; color: #4D6D75; margin-top: 2px; }
  select, input[type="number"], input[type="text"] { width: 100%; padding: 7px 9px; border: 1px solid #D5E5E6; border-radius: 8px; font-size: 13px; background: #fff; }
  select:focus, input:focus { outline: none; border-color: #FE6603; }
  .row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .row label { font-size: 13px; white-space: nowrap; min-width: 56px; }
  .mm-info { font-size: 12px; color: #7C8794; margin-top: 8px; background: #FFF4EC; border-radius: 8px; padding: 7px 10px; }
  /* 底色 */
  .swatches { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .swatch { width: 36px; height: 36px; border-radius: 10px; border: 2px solid transparent; cursor: pointer; position: relative; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
  .swatch.active { border-color: #FE6603; box-shadow: 0 0 0 3px rgba(254,102,3,.2); }
  .swatch span { position: absolute; bottom: -17px; left: 50%; transform: translateX(-50%); font-size: 10px; color: #7C8794; white-space: nowrap; }
  .swatch-wrap { margin-bottom: 24px; }
  .hex-row { display: flex; gap: 8px; align-items: center; }
  .hex-row input[type="color"] { width: 44px; height: 34px; padding: 2px; border: 1px solid #D5E5E6; border-radius: 8px; cursor: pointer; background: #fff; }
  .hex-row input[type="text"] { font-family: Consolas, monospace; }
  button { background: #FE6603; color: #fff; border: none; border-radius: 10px; padding: 10px 14px; font-size: 14px; cursor: pointer; width: 100%; transition: opacity .15s; }
  button:hover { opacity: .9; }
  button:disabled { background: #c5c1d8; cursor: not-allowed; }
  button.secondary { background: #fff; color: #FE6603; border: 1.5px solid #FDBA8A; }
  button.secondary:hover { background: #EEF9F9; opacity: 1; }
  button.green { background: #FE6603; }
  .slider-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .slider-row label { font-size: 12px; min-width: 56px; color: #244B55; }
  .slider-row input[type="range"] { flex: 1; accent-color: #FE6603; }
  .slider-row .val { font-size: 12px; min-width: 40px; text-align: right; color: #7C8794; }
  .status { font-size: 12px; color: #6f6b8c; background: #FFF4EC; border-radius: 8px; padding: 9px 10px; margin-top: 10px; min-height: 34px; line-height: 1.5; white-space: pre-wrap; }
  .status.err { color: #dc2626; background: #fef2f2; }
  /* 标签页 */
  .tabs { display: flex; gap: 6px; margin-bottom: 14px; }
  .tab { padding: 9px 22px; border-radius: 999px; background: #fff; cursor: pointer; font-size: 14px; border: 1.5px solid #E5E5E5; width: auto; color: #244B55; }
  .tab.active { background: #FE6603; color: #fff; border-color: transparent; font-weight: bold; }
  .tab-body { background: #fff; border-radius: 16px; box-shadow: 0 2px 16px rgba(90,80,160,.08); padding: 22px; flex: 1; display: none; flex-direction: column; align-items: center; }
  .tab-body.active { display: flex; }
  .canvas-holder { background: #fff; border: 1px solid #E5E5E5; border-radius: 12px; display: inline-block; line-height: 0; max-width: 100%; }
  canvas { max-width: 100%; max-height: 520px; height: auto; border-radius: 10px; }
  .print-controls { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 14px; width: 100%; }
  .print-controls .field { display: flex; flex-direction: column; gap: 4px; }
  .print-controls .field label { font-size: 12px; color: #7C8794; }
  .print-controls select { width: auto; min-width: 110px; }
  .print-controls button { width: auto; }
  .print-info { font-size: 13px; color: #244B55; margin-bottom: 12px; width: 100%; background: #F5FBFB; border-radius: 8px; padding: 8px 12px; }
  .hint { font-size: 12px; color: #7C8794; margin-top: 8px; line-height: 1.5; }
  .hidden { display: none !important; }


/* ================= 手机端适配 ================= */
@media (max-width: 768px) {
  body {
    min-width: 0;
    overflow-x: hidden;
  }

  header {
    padding: 12px 14px;
    gap: 10px;
  }

  .logo {
    width: 36px;
    height: 36px;
    font-size: 18px;
  }

  header h1 {
    font-size: 17px;
  }

  header p {
    font-size: 11px;
    line-height: 1.4;
  }

  .container {
    display: flex;
    flex-direction: column;
    padding: 0 10px 20px;
    gap: 12px;
  }

  .panel {
    border-radius: 12px;
    padding: 12px;
  }

  .controls {
    width: 100%;
    max-height: none;
    order: 1;
  }

  .preview {
    order: 2;
    width: 100%;
  }

  .step {
    padding: 12px;
    margin-bottom: 10px;
  }

  .step-title {
    font-size: 13px;
  }

  .dropzone {
    padding: 22px 8px;
  }

  .spec-grid {
    grid-template-columns: repeat(2, 1fr);
    max-height: none;
  }

  .spec-card {
    padding: 8px;
  }

  .row {
    flex-wrap: wrap;
  }

  .row label {
    min-width: auto;
  }

  .hex-row {
    flex-wrap: wrap;
  }

  button {
    min-height: 42px;
    font-size: 15px;
  }

  .tabs {
    position: sticky;
    top: 0;
    z-index: 5;
    background: #F2F4F7;
    padding: 6px 0;
  }

  .tab {
    flex: 1;
    padding: 10px 8px;
    font-size: 13px;
  }

  .tab-body {
    padding: 14px 8px;
    border-radius: 12px;
  }

  canvas {
    max-width: 100%;
    max-height: none;
    width: 100%;
    height: auto;
  }

  .canvas-holder {
    max-width: 100%;
  }

  .print-controls {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
  }

  .print-controls .field,
  .print-controls select,
  .print-controls button {
    width: 100%;
  }

  input, select {
    min-height: 40px;
    font-size: 15px;
  }

  .slider-row input[type="range"] {
    height: 28px;
  }
}

/* 小屏手机进一步优化 */
@media (max-width: 390px) {
  .spec-grid {
    grid-template-columns: 1fr;
  }

  header p {
    display: none;
  }
}


/* ===== 手机端布局增强 ===== */
@media(max-width:768px){
 header{padding:12px 16px;}
 header h1{font-size:18px;}
 header p{font-size:11px;}
 .container{display:flex;flex-direction:column;padding:0 12px 20px;gap:12px;}
 .controls{width:100%;max-height:none;order:2;}
 .preview{order:1;}
 .panel,.tab-body{padding:14px;border-radius:14px;}
 .step{padding:12px;margin-bottom:10px;}
 .spec-grid{grid-template-columns:1fr 1fr;max-height:none;}
 .tab{flex:1;padding:10px 6px;font-size:13px;}
 .tabs{width:100%;}
 canvas{max-height:360px;width:auto;height:auto;}
 .canvas-holder{width:auto;max-width:100%;display:flex;justify-content:center;padding:8px;}
 .print-controls{display:block;}
 .print-controls .field,.print-controls button{width:100%;margin-bottom:8px;}
 .print-controls select{width:100%;}
 .row{flex-wrap:wrap;}
}

  /* 商业版预览区域控制 */
  .preview .tab-body { min-height: auto; }
  #tab-photo .canvas-holder { max-height: 560px; }
  #resultCanvas { max-width: 295px; }
</style>

</head>
<body>
<header>
  <div class="logo"><img src="icon.png" width="42" height="42" alt=""/></div>
  <div>
    <h1>印啦啦AI证件照</h1>
    <p>专业AI证件照制作 · 背景替换 · 换装美颜 · 一键生成</p>
  </div>
</header>

<div class="container">
  <!-- 左侧控制面板 -->
  <div class="panel controls">
    <div class="step">
      <div class="step-title"><span class="num">1</span>打开照片</div>
      <div class="dropzone" id="dropzone">
        <div class="dz-icon">📤</div>
        <div class="dz-main">点击或拖拽照片到这里</div>
        <div class="dz-sub" id="dzSub">支持 JPG / PNG / WEBP ｜ 建议相对正面照，手机自拍即可</div>
      </div>
      <input type="file" id="fileInput" accept="image/*" class="hidden">
    </div>

    <div class="step">
      <div class="step-title"><span class="num">2</span>选择证件规格</div>
      <div class="spec-grid" id="specGrid"></div>
      <div class="row" id="customSizeRow" style="margin-top:10px;display:none;">
        <label>宽(px)</label><input type="number" id="customW" min="1">
        <label>高(px)</label><input type="number" id="customH" min="1">
      </div>
      <div class="mm-info" id="mmInfo"></div>
    </div>

    <div class="step">
      <div class="step-title"><span class="num">3</span>选择证件底色</div>
      <div class="swatch-wrap">
        <div class="swatches" id="swatches"></div>
      </div>
      <div class="hex-row">
        <input type="color" id="customColor" value="#ffffff">
        <input type="text" id="hexColor" value="#FFFFFF" maxlength="7" spellcheck="false">
        <label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;color:#244B55;white-space:nowrap;">
          <input type="checkbox" id="keepBg"> 保留原背景
        </label>
      </div>
    </div>

    <div class="step">
      <div class="step-title"><span class="num">4</span>AI 生成证件照</div>
      <button id="btnAI" disabled>一键 AI 生成（抠图 + 定位）</button>
      <div class="hint">首次使用需联网下载 AI 模型（约 88MB，之后浏览器缓存离线可用）。也可勾选「保留原图背景」后点「仅裁剪排版」跳过 AI。</div>
      <button id="btnCropOnly" class="secondary" style="margin-top:8px;" disabled>仅裁剪排版（不抠图）</button>
      <div class="status" id="status">请先打开照片。</div>
    </div>

    <div class="step">
      <div class="step-title"><span class="num">5</span>手动微调（所见即所得）</div>
      <div class="slider-row"><label>缩放</label><input type="range" id="adjZoom" min="50" max="250" value="100"><span class="val" id="adjZoomVal">100%</span></div>
      <div class="slider-row"><label>水平</label><input type="range" id="adjX" min="-100" max="100" value="0"><span class="val" id="adjXVal">0</span></div>
      <div class="slider-row"><label>垂直</label><input type="range" id="adjY" min="-100" max="100" value="0"><span class="val" id="adjYVal">0</span></div>
      <button id="btnResetAdj" class="secondary">重置微调</button>
    </div>

    <div class="step">
      <div class="step-title"><span class="num">6</span>导出证件照</div>
      <div class="row">
        <label>格式</label>
        <select id="exportFormat">
          <option value="jpeg">JPG</option>
          <option value="png">PNG</option>
        </select>
        <label>大小上限</label>
        <input type="number" id="maxKB" min="0" value="0" style="width:80px;">
        <span style="font-size:12px;">KB(0=不限)</span>
      </div>
      <button id="btnExport" class="green" disabled>导出证件照</button>
      <div class="mm-info" id="exportInfo"></div>
    </div>
  </div>

  <!-- 右侧预览 -->
  <div class="preview">
    <div class="tabs">
      <button class="tab active" data-tab="photo">证件照预览</button>
      <button class="tab" data-tab="print">相纸排版打印</button>
    </div>

    <div class="tab-body active" id="tab-photo">
      <div class="canvas-holder"><canvas id="resultCanvas" width="295" height="413"></canvas></div>
      <div class="hint" style="margin-top:10px;">左侧第 4 步生成后，此处显示最终证件照效果。</div>
    </div>

    <div class="tab-body" id="tab-print">
      <div class="print-controls">
        <div class="field"><label>相纸</label>
          <select id="paperSize">
            <option value="5R" selected>5寸相纸 (127×89mm)</option>
            <option value="6R">6寸相纸 (152×102mm)</option>
          </select>
        </div>
        <div class="field"><label>相纸方向</label>
          <select id="paperOrient">
            <option value="portrait">竖向</option>
            <option value="landscape">横向</option>
          </select>
        </div>
        <div class="field"><label>照片方向</label>
          <select id="photoOrient">
            <option value="portrait">竖向</option>
            <option value="landscape">横向</option>
          </select>
        </div>
        <button id="btnLayout">生成排版</button>
        <button id="btnExportPrint" class="green" disabled>导出排版图</button>
      </div>
      <div class="print-info" id="printInfo">生成证件照后，选择5寸或6寸相纸生成排版，可直接送打印店输出。</div>
      <div class="canvas-holder"><canvas id="printCanvas" width="600" height="400"></canvas></div>
    </div>
  </div>
</div>

<script>
// face-api.js 多 CDN 源容错加载：jsdelivr 在部分网络（公司网/校园网/部分运营商）下不可达时自动换源
(function () {
  const urls = [
    "https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js",
    "https://fastly.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js",
    "https://gcore.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js",
    "https://unpkg.com/face-api.js@0.22.2/dist/face-api.min.js",
  ];
  (function tryLoad(i) {
    if (i >= urls.length) { console.warn("face-api.js 所有 CDN 源均加载失败，将跳过人脸检测（不影响 AI 抠图）"); return; }
    const s = document.createElement("script");
    s.src = urls[i];
    s.onload = () => console.log("face-api.js 已加载：" + urls[i]);
    s.onerror = () => tryLoad(i + 1);
    document.head.appendChild(s);
  })(0);
})();
</script>
<script type="module">
// ==================== 数据定义 ====================
const SIZE_PRESETS = [
  { name: "一寸", w: 295, h: 413, wmm: 24.98, hmm: 34.97, desc: "简历/学生证常用", dot: "#438EDB" },
  { name: "二寸", w: 413, h: 579, wmm: 34.97, hmm: 49.02, desc: "毕业证/简历常用", dot: "#438EDB" },
  { name: "小一寸", w: 260, h: 378, wmm: 22.01, hmm: 32.00, desc: "驾驶证/体检表", dot: "#FFFFFF" },
  { name: "小二寸", w: 413, h: 531, wmm: 34.97, hmm: 44.96, desc: "护照/签证常用", dot: "#FFFFFF" },
  { name: "大一寸", w: 390, h: 567, wmm: 33.02, hmm: 48.01, desc: "部分考试报名", dot: "#438EDB" },
  { name: "大二寸", w: 413, h: 626, wmm: 34.97, hmm: 53.00, desc: "部分资格考试", dot: "#438EDB" },
  { name: "教师资格证", w: 295, h: 413, wmm: 24.98, hmm: 34.97, desc: "教资报名专用", dot: "#FFFFFF" },
  { name: "国家公务员考试", w: 295, h: 413, wmm: 24.98, hmm: 34.97, desc: "国考报名专用", dot: "#438EDB" },
  { name: "初级会计考试", w: 295, h: 413, wmm: 24.98, hmm: 34.97, desc: "会计资格报名", dot: "#FFFFFF" },
  { name: "英语四六级考试", w: 144, h: 192, wmm: 12.19, hmm: 16.26, desc: "四六级报名", dot: "#438EDB" },
  { name: "计算机等级考试", w: 390, h: 567, wmm: 33.02, hmm: 48.01, desc: "NCRE 报名", dot: "#FFFFFF" },
  { name: "研究生考试", w: 531, h: 709, wmm: 44.96, hmm: 60.03, desc: "考研报名", dot: "#FFFFFF" },
  { name: "社保卡", w: 358, h: 441, wmm: 30.31, hmm: 37.34, desc: "社保卡照片", dot: "#FFFFFF" },
  { name: "电子驾驶证", w: 260, h: 378, wmm: 22.01, hmm: 32.00, desc: "交管12123", dot: "#FFFFFF" },
  { name: "五寸", w: 1050, h: 1499, wmm: 88.90, hmm: 126.92, desc: "生活照打印", dot: "#FFFFFF" },
  { name: "自定义", w: 0, h: 0, wmm: 0, hmm: 0, desc: "自由设置宽高", dot: "#D3D3D3" },
];
const BG_COLORS = [
  { name: "白色", value: "#FFFFFF" },
  { name: "红色", value: "#FF0000" },
  { name: "蓝色", value: "#438EDB" },
  { name: "深蓝", value: "#2D3A8C" },
  { name: "浅灰", value: "#D3D3D3" },
];
const PAPERS = {
  "5R": { wmm: 127, hmm: 89 },
  "6R": { wmm: 152, hmm: 102 },
};
const DPI = 300;
const mm2px = mm => Math.round(mm / 25.4 * DPI);

// ==================== 状态 ====================
const state = {
  srcImg: null,        // 原始照片 Image
  cutImg: null,        // 抠图后 Image（透明底），null 表示用原图
  faceBox: null,       // {x,y,w,h} 源图像素坐标
  personTop: null,     // 人物真实头顶（源图 y 坐标，来自抠图轮廓）
  base: null,          // {scale, x, y} 基础摆放参数
  bgColor: "#FFFFFF",
  keepBg: false,
  faceModelReady: false,
  resultReady: false,
};

// ==================== DOM ====================
const $ = id => document.getElementById(id);
const statusEl = $("status");
function setStatus(msg, isErr = false) {
  statusEl.textContent = msg;
  statusEl.classList.toggle("err", isErr);
}

// ==================== 初始化 UI ====================
state.presetIdx = 0;
// 规格卡片
const specGrid = $("specGrid");
SIZE_PRESETS.forEach((p, i) => {
  const card = document.createElement("div");
  card.className = "spec-card" + (i === 0 ? " active" : "");
  const sizeText = p.name === "自定义" ? "自由宽高" : `${p.w}×${p.h}px`;

// ==================== AI 模型 ====================
async function ensureFaceModel() {
  if (state.faceModelReady) return true;
  if (typeof faceapi === "undefined") return false;
  // 人脸检测模型权重：多 CDN 源容错，任一源不可达自动换下一个
  const WEIGHT_URLS = [
    "https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights",
    "https://fastly.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights",
    "https://gcore.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights",
    "https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights",
  ];
  for (const url of WEIGHT_URLS) {
    try {
      await faceapi.nets.tinyFaceDetector.loadFromUri(url);
      state.faceModelReady = true;
      return true;
    } catch (e) {
      console.warn("人脸模型加载失败，换源重试", url, e);
    }
  }
  console.warn("人脸模型所有源均加载失败，将跳过人脸检测（不影响 AI 抠图）");
  return false;
}

let __segPipe = null;

// 遮罩清理管线（双阈值磁滞重建 + 闭运算填孔 + 羽化）：
// 强阈值(a>140)取"确定是人"的核心并保留其最大连通块；弱阈值(a>40)区域仅当与核心相连才保留。
// 外围斑块与人体核心不相连 → 被清除；不确定但与身体相连的部位（浅色头发/脸边缘）→ 保留。
function cleanMask(px, rw, rh) {
  const MW = 512, MH = Math.max(1, Math.round(MW * rh / rw));
  const strong = new Uint8Array(MW * MH);
  const weak = new Uint8Array(MW * MH);
  for (let my = 0; my < MH; my++)
    for (let mx = 0; mx < MW; mx++) {
      const sx = Math.min(rw - 1, (mx * rw / MW) | 0);
      const sy = Math.min(rh - 1, (my * rh / MH) | 0);
      const a = px[(sy * rw + sx) * 4 + 3];
      strong[my * MW + mx] = a > 140 ? 1 : 0;
      weak[my * MW + mx] = a > 40 ? 1 : 0;
    }
  // 1) 强核心的最大连通块
  const label = new Int32Array(MW * MH).fill(-1);
  const area = [];
  let nComp = 0;
  const stack = [];
  for (let i = 0; i < MW * MH; i++) {
    if (!strong[i] || label[i] >= 0) continue;
    const id = nComp++;
    let cnt = 0;
    stack.length = 0; stack.push(i); label[i] = id;
    while (stack.length) {
      const cur = stack.pop(); cnt++;
      const cx0 = cur % MW, cy0 = (cur / MW) | 0;
      if (cx0 > 0 && strong[cur - 1] && label[cur - 1] < 0) { label[cur - 1] = id; stack.push(cur - 1); }
      if (cx0 < MW - 1 && strong[cur + 1] && label[cur + 1] < 0) { label[cur + 1] = id; stack.push(cur + 1); }
      if (cy0 > 0 && strong[cur - MW] && label[cur - MW] < 0) { label[cur - MW] = id; stack.push(cur - MW); }
      if (cy0 < MH - 1 && strong[cur + MW] && label[cur + MW] < 0) { label[cur + MW] = id; stack.push(cur + MW); }
    }
    area[id] = cnt;
  }
  if (!nComp) return; // 没有可靠核心就不动遮罩
  let best = 0;
  for (let i = 1; i < nComp; i++) if (area[i] > area[best]) best = i;
  // 2) 从核心出发在弱遮罩上生长（磁滞重建）
  let m = new Uint8Array(MW * MH);
  stack.length = 0;
  for (let i = 0; i < MW * MH; i++) if (label[i] === best) { m[i] = 1; stack.push(i); }
  while (stack.length) {
    const cur = stack.pop();
    const cx0 = cur % MW, cy0 = (cur / MW) | 0;
    if (cx0 > 0 && weak[cur - 1] && !m[cur - 1]) { m[cur - 1] = 1; stack.push(cur - 1); }
    if (cx0 < MW - 1 && weak[cur + 1] && !m[cur + 1]) { m[cur + 1] = 1; stack.push(cur + 1); }
    if (cy0 > 0 && weak[cur - MW] && !m[cur - MW]) { m[cur - MW] = 1; stack.push(cur - MW); }
    if (cy0 < MH - 1 && weak[cur + MW] && !m[cur + MW]) { m[cur + MW] = 1; stack.push(cur + MW); }
  }
  // 3) 闭运算：填平人物内部小孔（脸/衣服上的色点）
  const dilate = (src, r) => {
    let t = new Uint8Array(MW * MH), out = new Uint8Array(MW * MH);
    for (let y = 0; y < MH; y++)
      for (let x = 0; x < MW; x++) {
        let v = 0;
        for (let k = -r; k <= r; k++) { const xx = x + k; if (xx >= 0 && xx < MW && src[y * MW + xx]) { v = 1; break; } }
        t[y * MW + x] = v;
      }
    for (let y = 0; y < MH; y++)
      for (let x = 0; x < MW; x++) {
        let v = 0;
        for (let k = -r; k <= r; k++) { const yy = y + k; if (yy >= 0 && yy < MH && t[yy * MW + x]) { v = 1; break; } }
        out[y * MW + x] = v;
      }
    return out;
  };
  const erode = (src, r) => {
    let t = new Uint8Array(MW * MH), out = new Uint8Array(MW * MH);
    for (let y = 0; y < MH; y++)
      for (let x = 0; x < MW; x++) {
        let v = 1;
        for (let k = -r; k <= r; k++) { const xx = x + k; if (xx < 0 || xx >= MW || !src[y * MW + xx]) { v = 0; break; } }
        t[y * MW + x] = v;
      }
    for (let y = 0; y < MH; y++)
      for (let x = 0; x < MW; x++) {
        let v = 1;
        for (let k = -r; k <= r; k++) { const yy = y + k; if (yy < 0 || yy >= MH || !t[yy * MW + x]) { v = 0; break; } }
        out[y * MW + x] = v;
      }
    return out;
  };
  m = erode(dilate(m, 3), 3);  // 闭运算填小孔（保留细丝：细线经膨胀-腐蚀后仍在）
  // 羽化：512 网格画到 canvas 再双线性放大回原尺寸，边缘自然过渡
  const mc = document.createElement("canvas"); mc.width = MW; mc.height = MH;
  const mctx = mc.getContext("2d");
  const mimg = mctx.createImageData(MW, MH);
  for (let i = 0; i < MW * MH; i++) {
    const v = m[i] * 255;
    mimg.data[i * 4] = v; mimg.data[i * 4 + 1] = v; mimg.data[i * 4 + 2] = v; mimg.data[i * 4 + 3] = 255;
  }
  mctx.putImageData(mimg, 0, 0);
  const big = document.createElement("canvas"); big.width = rw; big.height = rh;
  const bctx = big.getContext("2d");
  bctx.imageSmoothingEnabled = true; bctx.imageSmoothingQuality = "high";
  bctx.drawImage(mc, 0, 0, rw, rh);
  const soft = bctx.getImageData(0, 0, rw, rh).data;
  // 最终 alpha = min(模型原始软 alpha, 清理后遮罩)
  // 保留碎发的半透明细节（不丢发丝），被清理区域归零；仅压掉 alpha<25 的极弱丝
  for (let i = 0; i < rw * rh; i++) {
    const a = Math.min(px[i * 4 + 3], soft[i * 4]);
    px[i * 4 + 3] = a < 25 ? 0 : a;
  }
}

// 估计原背景色：取四边边缘带的每通道中位数
function estimateBg(px, rw, rh) {
  const samples = [[], [], []];
  const band = Math.max(2, Math.round(Math.min(rw, rh) * 0.03));
  for (let y = 0; y < rh; y += 2)
    for (let x = 0; x < rw; x += 2) {
      if (x < band || x >= rw - band || y < band || y >= rh - band) {
        const i = (y * rw + x) * 4;
        samples[0].push(px[i]); samples[1].push(px[i+1]); samples[2].push(px[i+2]);
      }
    }
  const med = arr => { arr.sort((a, b) => a - b); return arr[arr.length >> 1]; };
  return [med(samples[0]), med(samples[1]), med(samples[2])];
}

// 反混色（un-premultiply）：半透明像素的颜色 = (观测色 - (1-a)·背景色) / a
// 还原碎发/边缘的真实颜色，去掉"罩了一层原背景色"的白纱感
function unmixBg(px, rw, rh, bg) {
  for (let i = 0; i < rw * rh; i++) {
    const a = px[i * 4 + 3];
    if (a > 10 && a < 245) {
      const inv = 255 - a;
      for (let ch = 0; ch < 3; ch++) {
        const idx = i * 4 + ch;
        px[idx] = Math.max(0, Math.min(255, Math.round((px[idx] * 255 - inv * bg[ch]) / a)));
      }
    }
  }
}

// 颜色净化：边缘带像素的 RGB 从人物深内部逐层借色。
// 种子 = 完全不透明 且 颜色与原背景明显不同（白渣点颜色接近背景色 → 不当种子，会被借色修正）
function decontaminate(px, rw, rh, bg) {
  const colorDist = i => Math.abs(px[i*4] - bg[0]) + Math.abs(px[i*4+1] - bg[1]) + Math.abs(px[i*4+2] - bg[2]);
  const interior = new Uint8Array(rw * rh);
  for (let y = 1; y < rh - 1; y++)
    for (let x = 1; x < rw - 1; x++) {
      const i = y * rw + x;
      if (px[i*4+3] === 255 && colorDist(i) > 50
          && px[(i-1)*4+3] === 255 && px[(i+1)*4+3] === 255
          && px[(i-rw)*4+3] === 255 && px[(i+rw)*4+3] === 255)
        interior[i] = 1;
    }
  for (let iter = 0; iter < 20; iter++) {  // 20 轮 ≈ 覆盖 20px 边缘带（发际碎发较长）
    let changed = 0;
    for (let y = 1; y < rh - 1; y++)
      for (let x = 1; x < rw - 1; x++) {
        const i = y * rw + x;
        if (interior[i]) continue;
        if (interior[i-1] || interior[i+1] || interior[i-rw] || interior[i+rw]) {
          const j = interior[i-1] ? i-1 : interior[i+1] ? i+1 : interior[i-rw] ? i-rw : i+rw;
          px[i*4] = px[j*4]; px[i*4+1] = px[j*4+1]; px[i*4+2] = px[j*4+2];
          interior[i] = 1; changed++;
        }
      }
    if (!changed) break;
  }
}

// transformers.js AI 运行时：多 CDN 源容错（jsdelivr 被部分网络拦截时自动换源）
async function importTransformers() {
  const urls = [
    "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1",
    "https://fastly.jsdelivr.net/npm/@huggingface/transformers@3.8.1",
    "https://gcore.jsdelivr.net/npm/@huggingface/transformers@3.8.1",
    "https://unpkg.com/@huggingface/transformers@3.8.1",
  ];
  let lastErr = null;
  for (const u of urls) {
    try { return await import(u); } catch (e) { lastErr = e; console.warn("transformers.js 加载失败，换源重试", u, e); }
  }
  throw lastErr || new Error("AI 组件加载失败");
}

async function segmentImage(img) {
  // transformers.js 多 CDN 容错加载（wasm 路径自动指向所用源的 dist）
  const T = await importTransformers();
  T.env.allowLocalModels = false;
  if (!__segPipe) {
    const progress = p => {
      if (p.status === "progress" && p.total)
        setStatus(`正在下载抠图模型… ${Math.round((p.loaded || 0) / p.total * 100)}%`);
      else if (p.status === "done")
        setStatus("模型下载完成，正在编译初始化（首次需 1~3 分钟，请耐心等待）…");
      else if (p.status === "initiate")
        setStatus("正在加载抠图模型…");
    };
    // RMBG-1.4 模型：hf-mirror 国内可达，失败自动换 huggingface.co；
    // fp16（约88MB）遮罩质量优于 q8 量化版，每个镜像内失败自动回退 q8
    const HOSTS = ["https://hf-mirror.com", "https://huggingface.co"];
    const DTYPES = ["fp16", "q8"];
    let lastErr = null;
    outer: for (const host of HOSTS) {
      T.env.remoteHost = host;
      for (const dtype of DTYPES) {
        try {
          __segPipe = await T.pipeline("background-removal", "briaai/RMBG-1.4", { dtype, progress_callback: progress });
          break outer;
        } catch (e) {
          lastErr = e;
          console.warn(`抠图模型加载失败（${host} / ${dtype}），换源重试`, e);
        }
      }
    }
    if (!__segPipe) throw lastErr || new Error("抠图模型加载失败");
  }
  setStatus("正在 AI 抠图去背景（约 10~30 秒）…");
  // 超大照片先降采样到最长边 1600 再推理，明显提速；证件照输出远低于该尺寸，画质无损感
  const MAX_SEG = 1600;
  let sw = img.naturalWidth, sh = img.naturalHeight;
  if (Math.max(sw, sh) > MAX_SEG) {
    const k = MAX_SEG / Math.max(sw, sh);
    sw = Math.round(sw * k); sh = Math.round(sh * k);
  }
  const c = document.createElement("canvas");
  c.width = sw; c.height = sh;
  const ctx0 = c.getContext("2d");
  ctx0.drawImage(img, 0, 0, sw, sh);
  // 从原图边缘带估计背景色（用于反混色和污染点识别）
  const srcPx = ctx0.getImageData(0, 0, sw, sh).data;
  const bg = estimateBg(srcPx, sw, sh);
  const out = await __segPipe(c.toDataURL("image/png"));
  const rgba = out[0]; // RawImage，RGBA，与送入尺寸相同
  const px = new Uint8ClampedArray(rgba.data);
  const rw = rgba.width, rh = rgba.height;
  cleanMask(px, rw, rh);
  unmixBg(px, rw, rh, bg);        // 半透明像素按原背景色反混色，还原碎发真实颜色
  decontaminate(px, rw, rh, bg);  // 边缘带+污染点从人物内部借色
  const cc = document.createElement("canvas");
  cc.width = rw; cc.height = rh;
  cc.getContext("2d").putImageData(new ImageData(px, rw, rh), 0, 0);
  // 从 alpha 轮廓找人物真实头顶行（含发型），换算回原图坐标系，用于精准定位
  let topRow = -1;
  outer: for (let y = 0; y < rgba.height; y++) {
    for (let x = 0; x < rgba.width; x++) {
      if (px[(y * rgba.width + x) * 4 + 3] > 30) { topRow = y; break outer; }
    }
  }
  const cut = new Image();
  await new Promise((res, rej) => { cut.onload = res; cut.onerror = rej; cut.src = cc.toDataURL("image/png"); });
  const personTopSrc = topRow >= 0 ? topRow * (img.naturalHeight / rgba.height) : null;
  return { cut, personTopSrc };
}

// ==================== 一键 AI 生成 ====================
$("btnAI").onclick = () => runAI();
async function runAI() {
  if (!state.srcImg || state.aiBusy) return;
  state.aiBusy = true;
  $("btnAI").disabled = true;
  try {
    // 1. 人脸检测
    setStatus("正在加载人脸检测模型…");
    const faceOk = await ensureFaceModel();
    if (faceOk) {
      setStatus("正在检测人脸…");
      const det = await faceapi.detectSingleFace(
        state.srcImg, new faceapi.TinyFaceDetectorOptions({ inputSize: 512, scoreThreshold: 0.3 })
      );
      if (det) {
        const b = det.box;
        state.faceBox = { x: b.x, y: b.y, w: b.width, h: b.height };
      } else {
        state.faceBox = null;
        console.warn("未检测到人脸，使用居中裁剪");
      }
    } else {
      state.faceBox = null;
    }

    // 2. 抠图（保留原背景则跳过）
    if (!state.keepBg) {
      setStatus("正在 AI 抠图去背景（首次需下载模型，请稍候）…");
      const seg = await segmentImage(state.srcImg);
      state.cutImg = seg.cut;
      state.personTop = seg.personTopSrc; // 人物真实头顶（原图坐标）
    } else {
      state.cutImg = null;
      state.personTop = null;
    }

    // 3. 合成
    resetAdjust();
    computeBase();
    state.resultReady = true;
    render();
    $("btnExport").disabled = false;
    setStatus("生成完成！可用第 5 步微调位置，第 6 步导出。\n如需打印，切换到「相纸排版打印」标签页。");
  } catch (e) {
    console.error(e);
    const msg = (e && e.message) || String(e);
    const isNet = /fetch|network|网络/i.test(msg);
    setStatus("AI 处理失败：" + msg + (isNet
      ? "\n这是网络问题：AI 模型需要从网上下载。请确认已联网，建议用 Edge/Chrome 直接打开本文件（不要在微信里直接打开），公司/校园网可能拦截了模型下载，可换手机热点重试。"
      : "") + "\n也可勾选「保留原背景」后用「仅裁剪排版」（不需要联网）。", true);
  } finally {
    state.aiBusy = false;
    $("btnAI").disabled = false;
  }
};

// 仅裁剪排版（不用 AI）
$("btnCropOnly").onclick = () => {
  if (!state.srcImg) return;
  state.cutImg = null;
  state.faceBox = null;
  state.personTop = null;
  resetAdjust();
  computeBase();
  state.resultReady = true;
  render();
  $("btnExport").disabled = false;
  setStatus("已按居中裁剪排版。可手动微调位置后导出。");
};

// ==================== 合成渲染 ====================
function computeBase() {
  if (!state.srcImg) return;
  const s = currentSize();
  const W = s.w, H = s.h;
  const imgW = state.srcImg.naturalWidth, imgH = state.srcImg.naturalHeight;
  const cover = Math.max(W / imgW, H / imgH); // 铺满画布所需最小缩放
  let scale, x, y;
  if (state.faceBox) {
    const f = state.faceBox;
    // 头顶：优先用抠图轮廓的真实顶（含发型，最准），否则按检测框估算
    // 健壮性：轮廓顶必须位于检测框中点以上，否则视为无效（遮罩异常时回退估算值）
    let crownY = f.y - f.h * 0.6;
    if (state.personTop != null && state.personTop < f.y + f.h * 0.5) crownY = state.personTop;
    const chinY = f.y + f.h;
    const headH = Math.max(1, chinY - crownY);
    scale = (H * 0.62) / headH;          // 头（含发型）占照片高约 62%
    const faceCx = f.x + f.w / 2;
    // 若按头部比例缩放后无法同时"铺满画布 + 人脸居中"，就放大到能满足为止
    const needX = Math.max(W / (2 * Math.max(1, faceCx)),
                           W / (2 * Math.max(1, imgW - faceCx)));
    scale = Math.max(scale, cover, needX);
    x = W / 2 - faceCx * scale;          // 人脸始终水平居中
    y = H * 0.07 - crownY * scale;       // 头顶留约 7% 上边距
    // 垂直兜底：若底部盖不住画布，整体下移；若头顶被顶出画布，最多压到 0
    y = Math.max(y, H - imgH * scale);
    y = Math.min(y, H * 0.15);
  } else {
    scale = cover;                        // 覆盖式居中
    x = (W - imgW * scale) / 2;
    y = (H - imgH * scale) / 2;
  }
  state.base = { scale, x, y };
}

function render() {
  const canvas = $("resultCanvas");
  const s = currentSize();
  canvas.width = s.w; canvas.height = s.h;
  const ctx = canvas.getContext("2d");
  // 底色
  if (state.keepBg) {
    ctx.fillStyle = "#FFFFFF";
  } else {
    ctx.fillStyle = state.bgColor;
  }
  ctx.fillRect(0, 0, s.w, s.h);
  // 人物（上传/拍照后先显示原图预览，AI生成后再按证件照规则渲染）
  if (state.srcImg && !state.base) {
    const scale = Math.min(s.w / state.srcImg.naturalWidth, s.h / state.srcImg.naturalHeight);
    const dw = state.srcImg.naturalWidth * scale;
    const dh = state.srcImg.naturalHeight * scale;
    ctx.drawImage(state.srcImg, (s.w - dw) / 2, (s.h - dh) / 2, dw, dh);
    return;
  }
  if (state.srcImg && state.base) {
    const zoom = +$("adjZoom").value / 100;
    const dx = +$("adjX").value / 100 * s.w / 2;
    const dy = +$("adjY").value / 100 * s.h / 2;
    const img = state.cutImg || state.srcImg;
    // 摆放坐标一律按原图尺寸计算（抠图结果可能经过降采样，分辨率不同但比例一致）
    const srcW = state.srcImg.naturalWidth, srcH = state.srcImg.naturalHeight;
    const sc = state.base.scale * zoom;
    const dw = srcW * sc, dh = srcH * sc;
    // 缩放时以照片中心为基准
    const cx = state.base.x + srcW * state.base.scale / 2;
    const cy = state.base.y + srcH * state.base.scale / 2;
    ctx.drawImage(img, cx - dw / 2 + dx, cy - dh / 2 + dy, dw, dh);
  }
}

// 微调滑条
["adjZoom", "adjX", "adjY"].forEach(id => {
  $(id).oninput = () => {
    $("adjZoomVal").textContent = $("adjZoom").value + "%";
    $("adjXVal").textContent = $("adjX").value;
    $("adjYVal").textContent = $("adjY").value;
    render();
  };
});
function resetAdjust() {
  $("adjZoom").value = 100; $("adjX").value = 0; $("adjY").value = 0;
  $("adjZoomVal").textContent = "100%"; $("adjXVal").textContent = "0"; $("adjYVal").textContent = "0";
}
$("btnResetAdj").onclick = () => { resetAdjust(); render(); };

// ==================== 导出证件照 ====================
function canvasToBlobLimit(canvas, format, maxKB) {
  return new Promise(resolve => {
    const mime = format === "png" ? "image/png" : "image/jpeg";
    if (format === "png" || !maxKB || maxKB <= 0) {
      canvas.toBlob(b => resolve({ blob: b, note: "" }), mime, 0.95);
      return;
    }
    let q = 0.92;
    const tryQ = () => {
      canvas.toBlob(b => {
        const kb = b.size / 1024;
        if (kb <= maxKB || q <= 0.1) {
          resolve({ blob: b, note: kb > maxKB ? `（已压到最低质量仍 ${kb.toFixed(0)}KB）` : `（质量 ${Math.round(q * 100)}%，${kb.toFixed(0)}KB）` });
        } else { q -= 0.08; tryQ(); }
      }, mime, q);
    };
    tryQ();
  });
}

function downloadBlob(blob, filename) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

$("btnExport").onclick = async () => {
  const s = currentSize();
  const format = $("exportFormat").value;
  const maxKB = +$("maxKB").value || 0;
  const { blob, note } = await canvasToBlobLimit($("resultCanvas"), format, maxKB);
  downloadBlob(blob, `证件照_${s.name}_${s.w}x${s.h}.${format === "png" ? "png" : "jpg"}`);
  $("exportInfo").textContent = `已导出 ${s.w}×${s.h}px ${note}`;
};

// ==================== 相纸排版 ====================
$("btnLayout").onclick = () => {
  if (!state.resultReady) { alert("请先在左侧第 4 步生成证件照。"); return; }
  const s = currentSize();
  const paper = PAPERS[$("paperSize").value] || PAPERS["6R"];
  let pwmm = paper.wmm, phmm = paper.hmm;
  if ($("paperOrient").value === "landscape") [pwmm, phmm] = [phmm, pwmm];
  let fwmm = s.wmm, fhmm = s.hmm;
  if ($("photoOrient").value === "landscape") [fwmm, fhmm] = [fhmm, fwmm];

  const paperW = mm2px(pwmm), paperH = mm2px(phmm);
  const photoW = mm2px(fwmm), photoH = mm2px(fhmm);
  const gap = mm2px(2), margin = mm2px(3);

  const cols = Math.floor((paperW - margin * 2 + gap) / (photoW + gap));
  const rows = Math.floor((paperH - margin * 2 + gap) / (photoH + gap));
  if (cols < 1 || rows < 1) {
    $("printInfo").textContent = `当前相纸放不下 ${fwmm.toFixed(0)}×${fhmm.toFixed(0)}mm 的照片，请换更大的相纸或调整方向。`;
    return;
  }
  const total = cols * rows;
  const canvas = $("printCanvas");
  canvas.width = paperW; canvas.height = paperH;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#FFFFFF";
  ctx.fillRect(0, 0, paperW, paperH);
  const usedW = cols * photoW + (cols - 1) * gap;
  const usedH = rows * photoH + (rows - 1) * gap;
  const startX = (paperW - usedW) / 2, startY = (paperH - usedH) / 2;
  const src = $("resultCanvas");
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const px = startX + c * (photoW + gap), py = startY + r * (photoH + gap);
      if ($("photoOrient").value === "landscape") {
        ctx.save();
        ctx.translate(px + photoW / 2, py + photoH / 2);
        ctx.rotate(Math.PI / 2);
        ctx.drawImage(src, -photoH / 2, -photoW / 2, photoH, photoW);
        ctx.restore();
      } else {
        ctx.drawImage(src, px, py, photoW, photoH);
      }
      // 裁剪参考线（细灰框）
      ctx.strokeStyle = "#CCCCCC";
      ctx.lineWidth = 2;
      ctx.strokeRect(px, py, photoW, photoH);
    }
  }
  $("printInfo").textContent = `${$("paperSize").selectedOptions[0].text} ｜ 每张照片 ${fwmm.toFixed(1)}×${fhmm.toFixed(1)}mm ｜ 共 ${total} 张（${cols}列×${rows}行）｜ 输出 ${paperW}×${paperH}px @300DPI`;
  $("btnExportPrint").disabled = false;
};

$("btnExportPrint").onclick = () => {
  $("printCanvas").toBlob(b => {
    downloadBlob(b, `相纸排版_${$("paperSize").value}_${$("paperOrient").value === "landscape" ? "横" : "竖"}.jpg`);
  }, "image/jpeg", 0.95);
};

// ==================== 标签页 ====================
document.querySelectorAll(".tab").forEach(t => {
  t.onclick = () => {
    document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
    document.querySelectorAll(".tab-body").forEach(x => x.classList.remove("active"));
    t.classList.add("active");
    $("tab-" + t.dataset.tab).classList.add("active");
  };
});
</script>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>印啦啦注册码生成器</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f0eb;color:#20252d;font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif}
.wrap{max-width:760px;margin:40px auto;padding:0 18px}.box{background:#fff;border:1px solid #e1ddd4;border-radius:18px;padding:28px;box-shadow:0 20px 50px rgba(31,36,45,.09)}
h1{margin:0 0 6px;font-size:22px}.sub{color:#7a808b;font-size:12px;margin-bottom:24px}
label{display:block;font-size:12px;font-weight:700;color:#4b515b;margin:14px 0 7px}
input{width:100%;height:42px;border:1px solid #ddd8ce;border-radius:10px;padding:0 12px;outline:none}
input:focus{border-color:#9f8655;box-shadow:0 0 0 3px rgba(183,154,98,.12)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{height:43px;border:0;border-radius:10px;padding:0 18px;font-weight:800;cursor:pointer}
.primary{background:#1f2937;color:#f4ead5}.copy{background:#f3efe7;color:#4b515b;margin-left:8px}
.result{margin-top:20px;background:#faf8f3;border:1px dashed #cfc5b3;border-radius:12px;padding:16px}
.code{font:800 22px/1.4 Consolas,monospace;letter-spacing:.06em;word-break:break-all}
.hint{font-size:11px;color:#8a8f97;line-height:1.7;margin-top:12px}
</style>
</head>
<body>
<div class="wrap"><div class="box">
<h1>印啦啦注册码生成器</h1>
<div class="sub">内部使用 · 单机永久授权 · 不联网</div>
<label>门店名称（仅用于你的记录）</label>
<input id="store" placeholder="例如：长葛店01">
<label>员工/电脑备注（可选）</label>
<input id="remark" placeholder="例如：前台1号电脑">
<label>机器码</label>
<input id="machine" placeholder="例如：A8F3-72KD-91XM-5PQ7">
<div style="margin-top:18px"><button class="primary" id="gen">生成注册码</button></div>
<div class="result">
<div style="font-size:11px;color:#7a808b;margin-bottom:6px">注册码</div>
<div class="code" id="code">—</div>
<div style="margin-top:12px"><button class="copy" id="copy">复制注册码</button></div>
</div>
<div class="hint">
使用方法：员工打开软件，把机器码发给你；你在这里填写门店和机器码并生成注册码，再把注册码发给员工。<br>
注册码只绑定机器码；门店名称和备注不会写入注册码。
</div>
</div></div>
<script>
const APP='YLL-STUDENT-NAMEPLATE-V1';
const SECRET='YLL-INTERNAL-2026-PRINT-AUTH-7K9P';
function hash32(str){
 let h=2166136261;
 for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}
 h+=h<<13;h^=h>>>7;h+=h<<3;h^=h>>>17;h+=h<<5;
 return (h>>>0).toString(16).toUpperCase().padStart(8,'0');
}
function makeCode(machine){
 const id=machine.replace(/-/g,'').trim().toUpperCase();
 if(!/^[0-9A-F]{32}$/.test(id)) return '';
 const raw=APP+'|'+id+'|'+SECRET;
 const a=hash32(raw),b=hash32(raw+'|A'),c=hash32(raw+'|B');
 return ('YLL-'+a.slice(0,4)+'-'+b.slice(0,4)+'-'+c.slice(0,4)).toUpperCase();
}
document.getElementById('gen').onclick=()=>{
 const m=document.getElementById('machine').value;
 const c=makeCode(m);
 document.getElementById('code').textContent=c||'机器码格式不正确';
 if(c) {
   const key='YLL_LICENSE_LOG';
   const arr=JSON.parse(localStorage.getItem(key)||'[]');
   arr.push({store:document.getElementById('store').value.trim(),remark:document.getElementById('remark').value.trim(),machine:m.trim().toUpperCase(),license:c,time:new Date().toLocaleString()});
   localStorage.setItem(key,JSON.stringify(arr));
 }
};
document.getElementById('copy').onclick=async()=>{
 const c=document.getElementById('code').textContent;
 if(c && c.startsWith('YLL-')) {await navigator.clipboard.writeText(c);document.getElementById('copy').textContent='已复制';setTimeout(()=>document.getElementById('copy').textContent='复制注册码',1200);}
};
</script>
</body>
</html>
